# Un proxy HTTP posé sur la ligne du domicile, joignable seulement depuis le
# mesh du studio. Il n'est pas une route par défaut : seules les requêtes qui
# le nomment passent par lui.
name: Aliud Sortie
version: 0.1.4
slug: sortie
description: Un proxy HTTP sur la ligne du domicile, réservé au mesh du studio
url: https://github.com/Aliud-Corp/aliud-sortie
arch:
  - aarch64
  - amd64
init: false
# Le proxy écoute sur l'adresse du mesh, qui vit dans l'espace réseau de l'hôte
# — c'est l'add-on NetBird qui la pose là. Sans ce partage, le conteneur ne
# verrait que le réseau interne du Supervisor et n'aurait aucune adresse à
# offrir au mesh.
host_network: true
startup: services
boot: auto
options:
  port: 8888
  utilisateur: aliud
  mot_de_passe: ""
  interface: wt0
  # Liste blanche, en expressions régulières de nom d'hôte. Sans elle, une clé
  # volée sur l'hôte ouvre un relais ouvert sur la ligne du domicile.
  #
  # `(.*\.)?` et non `(^|\.)` : tinyproxy compare avec `regexec`, donc en
  # expression rationnelle POSIX étendue, où `^` au milieu d'un groupe n'est pas
  # une ancre. Relevé le 09/09/2026 dans le journal de l'add-on — « Proxying
  # refused on filtered domain "api.ipify.org" » alors que le motif semblait
  # correspondre.
  #
  # Un hôte absent d'ici est refusé, et l'appelant ne voit qu'une absence de
  # réponse. Les hôtes des flux sont déclarés un par un dans
  # `platform/collecte/collecte.yaml` : cette liste suit ce fichier-là, recopiée
  # à la main pour l'instant.
  domaines:
    - "(.*\\.)?x\\.com$"
    - "(.*\\.)?twitter\\.com$"
    - "(.*\\.)?twimg\\.com$"
    - "(.*\\.)?reddit\\.com$"
    - "(.*\\.)?redd\\.it$"
    - "(.*\\.)?redditstatic\\.com$"
    - "(.*\\.)?ipify\\.org$"
    - "(.*\\.)?ifconfig\\.me$"
    - "(.*\\.)?lobste\\.rs$"
    - "(.*\\.)?ycombinator\\.com$"
    - "(.*\\.)?algolia\\.com$"
    - "(.*\\.)?algolianet\\.com$"
    - "(.*\\.)?photon-reddit\\.com$"
    - "(.*\\.)?simonwillison\\.net$"
    - "(.*\\.)?lwn\\.net$"
    - "(.*\\.)?phoronix\\.com$"
    - "(.*\\.)?status-ovhcloud\\.com$"
  journal: info
schema:
  port: port
  utilisateur: str
  mot_de_passe: password
  interface: str
  domaines:
    - str
  journal: list(critical|error|warning|notice|connect|info)
