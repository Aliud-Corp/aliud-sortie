# Un proxy HTTP posé sur la ligne du domicile, joignable seulement depuis le
# mesh du studio. Il n'est pas une route par défaut : seules les requêtes qui
# le nomment passent par lui.
name: Aliud Sortie
version: 0.1.6
slug: sortie
description: Un proxy HTTP sur la ligne du domicile, réservé au mesh du studio
url: https://github.com/Aliud-Corp/aliud-sortie
arch:
  - aarch64
  - amd64
init: false
# Le proxy écoute sur l'adresse du mesh, qui vit dans l'espace réseau de l'hôte
# — c'est l'add-on NetBird qui la pose là. Sans ce partage, le conteneur ne
# verrait que le réseau interne du Supervisor et n'aurait aucune adresse à
# offrir au mesh.
host_network: true
startup: services
boot: auto
options:
  port: 8888
  utilisateur: aliud
  mot_de_passe: ""
  interface: wt0
  # Liste blanche, en expressions régulières de nom d'hôte. Sans elle, une clé
  # volée sur l'hôte ouvre un relais ouvert sur la ligne du domicile.
  #
  # `(.*\.)?` et non `(^|\.)` : tinyproxy compare avec `regexec`, donc en
  # expression rationnelle POSIX étendue, où `^` au milieu d'un groupe n'est pas
  # une ancre. Relevé le 09/09/2026 dans le journal de l'add-on — « Proxying
  # refused on filtered domain "api.ipify.org" » alors que le motif semblait
  # correspondre.
  #
  # Un hôte absent d'ici est refusé, et l'appelant ne voit qu'une absence de
  # réponse. Les hôtes des flux sont déclarés un par un dans
  # `platform/collecte/collecte.yaml` : cette liste suit ce fichier-là, recopiée
  # à la main pour l'instant.
  domaines:
    - "(.*\\.)?x\\.com$"
    - "(.*\\.)?twitter\\.com$"
    - "(.*\\.)?twimg\\.com$"
    - "(.*\\.)?reddit\\.com$"
    - "(.*\\.)?redd\\.it$"
    - "(.*\\.)?redditstatic\\.com$"
    - "(.*\\.)?ipify\\.org$"
    - "(.*\\.)?ifconfig\\.me$"
    - "(.*\\.)?lobste\\.rs$"
    - "(.*\\.)?ycombinator\\.com$"
    - "(.*\\.)?algolia\\.com$"
    - "(.*\\.)?algolianet\\.com$"
    - "(.*\\.)?photon-reddit\\.com$"
    - "(.*\\.)?simonwillison\\.net$"
    - "(.*\\.)?lwn\\.net$"
    - "(.*\\.)?phoronix\\.com$"
    - "(.*\\.)?status-ovhcloud\\.com$"
    # LES CINQ HÔTES QUE `collecte.yaml` DÉCLARE ET QUE CETTE LISTE REFUSAIT
    # Mesuré le 16/09/2026 depuis le conteneur, par le proxy : les cinq rendent
    # `CONNECT tunnel failed, response 403`, quel que soit le transport. Le refus
    # vient d'ici, pas des sites — un tunnel refusé n'atteint jamais l'hôte visé,
    # et le collecteur ne voit qu'une source muette.
    #
    # Les quatre premiers sont les laboratoires demandés par le board le même
    # jour. `krebsonsecurity` était déclaré avant eux et lisait zéro depuis son
    # arrivée : c'est ce que coûte une liste recopiée à la main, elle se
    # désynchronise sans rien dire, et ce silence ressemble à un site qui n'a
    # rien publié.
    #
    # Les cinq ne servent qu'un flux ou un plan de site, en lecture.
    - "(.*\\.)?openai\\.com$"
    - "(.*\\.)?claude\\.com$"
    - "(.*\\.)?anthropic\\.com$"
    - "(.*\\.)?arxiv\\.org$"
    - "(.*\\.)?krebsonsecurity\\.com$"
    # Les hôtes d'une vidéo TikTok, relevés le 16/09/2026 sur un tirage
    # réel plutôt que devinés : la page est servie par `www.tiktok.com`, le flux
    # audio par `v16-webapp-prime.tiktok.com` et `v19-webapp-prime.tiktok.com`,
    # une redirection passe par `mon-i18n.tiktokv.com`, et le CDN régional rend
    # `v45.tiktokcdn-eu.com`. Les deux autres régions du CDN sont ajoutées ici
    # sans avoir été vues : le même compte lu depuis une autre sortie les rend,
    # et un refus sur celles-là se lirait comme une vidéo illisible.
    #
    # Ce que ça ouvre, et ce que ça n'ouvre pas : la compétence
    # `transcription` d'Aliud reconnaît aussi YouTube, Instagram, X, Vimeo,
    # Dailymotion et LinkedIn. Aucun de ces hôtes n'est ajouté ici. La liste
    # grandit quand un lien en a besoin, jamais avant — c'est ce qui la garde
    # relisable.
    - "(.*\\.)?tiktok\\.com$"
    - "(.*\\.)?tiktokv\\.com$"
    - "(.*\\.)?tiktokcdn\\.com$"
    - "(.*\\.)?tiktokcdn-eu\\.com$"
    - "(.*\\.)?tiktokcdn-us\\.com$"
  journal: info
schema:
  port: port
  utilisateur: str
  mot_de_passe: password
  interface: str
  domaines:
    - str
  journal: list(critical|error|warning|notice|connect|info)
