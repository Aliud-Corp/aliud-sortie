# Un proxy HTTP posé sur la ligne du domicile, joignable seulement depuis le
# mesh du studio. Il n'est pas une route par défaut : seules les requêtes qui
# le nomment passent par lui.
name: Aliud Sortie
version: 0.2.0
slug: sortie
description: Un proxy HTTP sur la ligne du domicile, réservé au mesh du studio
url: https://github.com/Aliud-Corp/aliud-sortie
arch:
  - aarch64
  - amd64
init: false
# Le proxy écoute sur l'adresse du mesh, qui vit dans l'espace réseau de l'hôte
# — c'est l'add-on NetBird qui la pose là. Sans ce partage, le conteneur ne
# verrait que le réseau interne du Supervisor et n'aurait aucune adresse à
# offrir au mesh.
host_network: true
startup: services
boot: auto
options:
  port: 8888
  utilisateur: aliud
  mot_de_passe: ""
  interface: wt0
  # LA LISTE EST OUVERTE DEPUIS LE 2026-09-19, ET C'EST UNE DÉCISION DU BOARD
  #
  # Elle portait trente-deux motifs, recopiés à la main depuis
  # `platform/collecte/collecte.yaml` du dépôt Aliud. Ce que ça a coûté est
  # écrit dans l'historique de ce fichier : `krebsonsecurity` a lu zéro pendant
  # des jours sans que rien ne le dise, cinq hôtes déclarés côté Aliud rendaient
  # `CONNECT tunnel failed, response 403`, et six médias reconnus par la
  # compétence de transcription n'étaient pas ouverts ici. Une liste recopiée se
  # désynchronise en silence, et ce silence ressemble à une source qui n'a rien
  # publié.
  #
  # CE QUE CETTE OUVERTURE NE CHANGE PAS, ET QUI PORTE LE POIDS
  # Trois verrous restent, et ils sont dans `run.sh` :
  #   - le proxy n'écoute que sur l'adresse du mesh, posée par NetBird ;
  #   - `BasicAuth` exige le mot de passe des options ;
  #   - `ConnectPort 443` n'ouvre aucun autre port — ni 22, ni 25.
  # Un relais ouvert sur Internet demanderait de tomber les trois, pas celui-ci.
  #
  # CE QUI CHANGE VRAIMENT
  # Le code du studio peut joindre n'importe quel hôte en HTTPS par la ligne du
  # domicile. Le risque n'est plus quelqu'un du dehors, c'est notre propre code
  # qui compose une adresse que personne n'a relue. Le journal de l'add-on reste
  # l'endroit où ça se verrait.
  #
  # `.*` ET PAS UNE LISTE VIDE : `run.sh` refuse de démarrer sur une liste vide,
  # parce qu'elle ne laisserait rien passer. Le motif qui dit « tout » est un
  # motif, pas une absence.
  domaines:
    - ".*"
  journal: info
schema:
  port: port
  utilisateur: str
  mot_de_passe: password
  interface: str
  domaines:
    - str
  journal: list(critical|error|warning|notice|connect|info)
