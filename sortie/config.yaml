# La sortie du studio : un proxy HTTP posé sur la ligne du domicile.
#
# Ce que ça sert : les scripts d'Hermes tournent sur un serveur d'hébergeur, et
# plusieurs médias refusent une adresse de datacenter à la première requête.
# Le code et le modèle restent donc sur Hermes ; seule la sortie réseau passe
# par ici.
#
# Ce que ça n'est pas : un nœud de sortie. Une route par défaut ferait passer
# tout le trafic de l'hôte — son inférence, sa supervision, ses sauvegardes —
# par une ligne domestique. Un proxy nommé dans un script ne déplace que les
# requêtes qui le nomment.
name: Aliud Sortie
version: 0.1.4
slug: sortie
description: Un proxy HTTP sur la ligne du domicile, réservé au mesh du studio
url: https://github.com/Aliud-Corp/aliud-sortie
arch:
  - aarch64
  - amd64
init: false
# Le proxy écoute sur l'adresse du mesh, qui vit dans l'espace réseau de l'hôte
# — c'est l'add-on NetBird qui la pose là. Sans ce partage, le conteneur ne
# verrait que le réseau interne du Supervisor et n'aurait aucune adresse à
# offrir au mesh.
host_network: true
startup: services
boot: auto
options:
  port: 8888
  utilisateur: aliud
  mot_de_passe: ""
  interface: wt0
  # Liste blanche, en expressions régulières de nom d'hôte. Sans elle, une clé
  # volée sur l'hôte ouvre un relais ouvert sur la ligne du domicile.
  #
  # `(.*\.)?` et non `(^|\.)` : tinyproxy compare avec `regexec`, donc en
  # expression rationnelle POSIX étendue, où `^` au milieu d'un groupe n'est pas
  # une ancre. Relevé le 09/09/2026 dans le journal de l'add-on — « Proxying
  # refused on filtered domain "api.ipify.org" » alors que le motif semblait
  # correspondre.
  #
  # LES SEPT MÉDIAS, ET LE PIÈGE DES FLUX RSS
  #
  # Un média lu par le collecteur doit être ici, sinon le proxy refuse et le
  # collecteur ne voit qu'une absence de réponse — mesuré le 09/09/2026, où les
  # trois sources de Lobsters sont revenues muettes faute de `lobste.rs` dans
  # cette liste.
  #
  # Les flux RSS n'ont pas d'hôte fixe : ils sont déclarés un par un dans
  # `platform/collecte/collecte.yaml`, donc cette liste doit suivre ce
  # fichier-là. Elle est recopiée à la main pour l'instant ; la dériver du
  # dépôt est la prochaine étape, parce qu'un flux ajouté en pull request qui
  # ne passe pas ici devient une source muette sans cause lisible.
  domaines:
    - "(.*\\.)?x\\.com$"
    - "(.*\\.)?twitter\\.com$"
    - "(.*\\.)?twimg\\.com$"
    - "(.*\\.)?reddit\\.com$"
    - "(.*\\.)?redd\\.it$"
    - "(.*\\.)?redditstatic\\.com$"
    - "(.*\\.)?ipify\\.org$"
    - "(.*\\.)?ifconfig\\.me$"
    # lobsters, hacker news et son index de recherche
    - "(.*\\.)?lobste\\.rs$"
    - "(.*\\.)?ycombinator\\.com$"
    - "(.*\\.)?algolia\\.com$"
    - "(.*\\.)?algolianet\\.com$"
    # arctic shift, les archives publiques de reddit
    - "(.*\\.)?photon-reddit\\.com$"
    # les flux RSS de collecte.yaml, un hôte par ligne
    - "(.*\\.)?simonwillison\\.net$"
    - "(.*\\.)?lwn\\.net$"
    - "(.*\\.)?phoronix\\.com$"
    - "(.*\\.)?status-ovhcloud\\.com$"
  journal: info
schema:
  port: port
  utilisateur: str
  mot_de_passe: password
  interface: str
  domaines:
    - str
  journal: list(critical|error|warning|notice|connect|info)
